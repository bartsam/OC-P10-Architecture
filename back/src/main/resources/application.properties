spring.application.name=poc-chat

# Le schéma est géré par Flyway (E3) : Hibernate ne fait que valider
spring.jpa.hibernate.ddl-auto=validate
# Évite l'ouverture de session JPA pendant le rendu des vues (inutile pour une API)
spring.jpa.open-in-view=false

# Pas de spring.datasource.* : la connexion vient de compose.yaml